blueprint:
  name: "Watson self-heal: reload a device that went unavailable"
  description: >-
    When a device stays **unavailable**, reload the integration it belongs to and record whether that brought it
    back. Watson (the Housekeeper App) reads that record, so the morning summary says "Watson fixed it" instead of
    asking you, or "Watson already tried" when it did not help.


    Backs off: each try waits at least as long as the device had already been down at the previous one (about
    5 min, 6 h, 12 h, 24 h, 48 h with the defaults), and once it has been down longer than "Give up after" it
    writes one last record ("gave up - needs a hand") and leaves it alone until the device has come back.


    Safe by design: it only reloads (it never switches anything), it refuses locks, climate, alarms, valves,
    sirens and water heaters, and it refuses whole-mesh integrations (MQTT / Zigbee2MQTT, ZHA, Z-Wave) - for those,
    use "restart an App when it is down".
  domain: automation
  source_url: https://github.com/MoriartySmartHouse/housekeeper-agent/blob/main/blueprints/automation/housekeeper/reload_unavailable_device.yaml
  input:
    target:
      name: Device
      description: An entity of the device that drops off (e.g. the bulb's light, the plug's switch).
      selector:
        entity:
          domain: [light, switch, media_player, fan, camera, sensor, binary_sensor, button, number, select, remote]
    minutes:
      name: Unavailable for
      default: 5
      selector:
        number: {min: 2, max: 120, unit_of_measurement: min}
    cooldown_hours:
      name: At most one try every
      description: The shortest gap between two tries; later gaps double (see above).
      default: 6
      selector:
        number: {min: 1, max: 48, unit_of_measurement: h}
    give_up_hours:
      name: Give up after
      description: Down longer than this - stop trying, record "gave up" once, and wait for the device to come back.
      default: 72
      selector:
        number: {min: 6, max: 720, unit_of_measurement: h}
    check_after:
      name: Check the result after
      default: 60
      selector:
        number: {min: 15, max: 600, unit_of_measurement: s}

mode: single
max_exceeded: silent

variables:
  target: !input target
  minutes: !input minutes
  cooldown_h: !input cooldown_hours
  give_up_h: !input give_up_hours
  mesh: [mqtt, zha, zwave_js, deconz, matter]
  # Seconds the device has been unavailable (0 when it is not). A reload does not reset this: when an integration
  # unloads, Home Assistant rewrites each registered entity as "unavailable" again, so its last_changed is kept.
  down_s: >-
    {{ (as_timestamp(now()) - as_timestamp(states[target].last_changed)) | round(0)
       if is_state(target, 'unavailable') else 0 }}
  # Seconds since this automation last acted (a try or the give-up record), or none.
  since_last: >-
    {%- set last = this.attributes.last_triggered if this else none -%}
    {{ (as_timestamp(now()) - as_timestamp(last)) | round(0) if last else none }}
  give_up: "{{ down_s >= give_up_h * 3600 }}"

triggers:
  - trigger: state
    entity_id: !input target
    to: unavailable
    for:
      minutes: !input minutes
  # Also look once an hour: a device that was already down when Home Assistant started has no state change to see.
  - trigger: time_pattern
    minutes: "17"

conditions:
  - condition: template
    value_template: >-
      {{ is_state(target, 'unavailable')
         and (now() - states[target].last_changed).total_seconds() >= minutes * 60 }}
  # Maintenance (HA label, on the entity or its device): someone is working on it - leave it alone.
  - condition: template
    value_template: >-
      {% set dev = device_id(target) %}
      {{ 'maintenance' not in (labels(target) or []) + ((labels(dev) or []) if dev else []) }}
  - condition: template
    value_template: >-
      {% set entry = config_entry_id(target) %}
      {{ entry is not none and config_entry_attr(entry, 'domain') not in mesh }}
  # Back-off ladder: past "give up", act once more only to record it; before that, wait at least the cooldown AND
  # at least as long as the device had already been down at the previous try (a try before this drop counts as 0).
  - condition: template
    value_template: >-
      {{ since_last is none
         or (since_last > down_s - give_up_h * 3600 if give_up
             else since_last > cooldown_h * 3600 and since_last >= down_s - since_last) }}

actions:
  - if:
      - condition: template
        value_template: "{{ give_up }}"
    then:
      - action: logbook.log
        data:
          name: Watson self-heal
          entity_id: "{{ target }}"
          message: >-
            {{ (state_attr(target, 'friendly_name') or target) | replace(': ', ' ') }}:
            gave up - down {{ (down_s / 3600) | round(0) | int }} h, needs a hand
    else:
      - action: homeassistant.reload_config_entry
        continue_on_error: true
        target:
          entity_id: "{{ target }}"
      - delay:
          seconds: !input check_after
      - action: logbook.log
        data:
          name: Watson self-heal
          entity_id: "{{ target }}"
          message: >-
            {{ (state_attr(target, 'friendly_name') or target) | replace(': ', ' ') }}:
            {{ 'still down' if is_state(target, 'unavailable') else 'fixed' }} - reloaded its integration
