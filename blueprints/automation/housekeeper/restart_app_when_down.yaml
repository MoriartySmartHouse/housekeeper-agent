blueprint:
  name: "Watson self-heal: restart an App when it is down"
  description: >-
    When an App (add-on) stops doing its job - its health sensor reads a bad state for a while - restart it,
    once per cooldown, and record whether that helped. The typical use is Zigbee2MQTT: its bridge connection sensor
    goes off when the App or the coordinator stalls. Watson (the Housekeeper App) reads the record.


    Safe by design: restarting an App never switches a device; the cooldown stops restart loops. If the restart
    does not help (for example the coordinator itself is unplugged), the record says "still down" and the morning
    summary asks you.


    Backs off: each restart waits at least as long as the App had already been down at the previous one (about
    5 min, 1 h, 2 h, 4 h, ... with the defaults), and once it has been down longer than "Give up after" it writes one
    last record ("gave up - needs a hand") and leaves it alone until it has come back. The down time is read from
    the health sensor, so pick one that keeps a single bad value while the App restarts (if it moves from one bad
    value to another, the ladder starts over and it behaves like a plain cooldown).
  domain: automation
  source_url: https://github.com/MoriartySmartHouse/housekeeper-agent/blob/main/blueprints/automation/housekeeper/restart_app_when_down.yaml
  input:
    app:
      name: App
      selector:
        addon: {}
    health:
      name: Health sensor
      description: An entity that shows the App is working, e.g. the Zigbee2MQTT bridge "connection state".
      selector:
        entity: {}
    bad_states:
      name: Counts as down when it reads
      default: ["off", "unavailable", "disconnected", "offline"]
      selector:
        select:
          multiple: true
          custom_value: true
          options: ["off", "unavailable", "unknown", "disconnected", "offline"]
    label:
      name: Name to use in the record
      default: ""
      selector:
        text: {}
    minutes:
      name: Down for
      default: 5
      selector:
        number: {min: 2, max: 120, unit_of_measurement: min}
    cooldown_hours:
      name: At most one restart every
      description: The shortest gap between two restarts; later gaps double (see above).
      default: 1
      selector:
        number: {min: 1, max: 48, unit_of_measurement: h}
    give_up_hours:
      name: Give up after
      description: Down longer than this - stop restarting, record "gave up" once, and wait for it to come back.
      default: 72
      selector:
        number: {min: 6, max: 720, unit_of_measurement: h}
    check_after:
      name: Check the result after
      default: 180
      selector:
        number: {min: 30, max: 900, unit_of_measurement: s}

mode: single
max_exceeded: silent

variables:
  app: !input app
  health: !input health
  bad: !input bad_states
  label: !input label
  minutes: !input minutes
  cooldown_h: !input cooldown_hours
  give_up_h: !input give_up_hours
  # Seconds the health sensor has read a bad value (0 when it does not).
  down_s: >-
    {{ (as_timestamp(now()) - as_timestamp(states[health].last_changed)) | round(0)
       if states[health] is not none and states(health) in bad else 0 }}
  # Seconds since this automation last acted (a restart or the give-up record), or none.
  since_last: >-
    {%- set last = this.attributes.last_triggered if this else none -%}
    {{ (as_timestamp(now()) - as_timestamp(last)) | round(0) if last else none }}
  give_up: "{{ down_s >= give_up_h * 3600 }}"

triggers:
  - trigger: state
    entity_id: !input health
    for:
      minutes: !input minutes
  - trigger: time_pattern
    minutes: "23"

conditions:
  - condition: template
    value_template: >-
      {{ states(health) in bad and (now() - states[health].last_changed).total_seconds() >= minutes * 60 }}
  # Maintenance (HA label, on the entity or its device): someone is working on it - leave it alone.
  - condition: template
    value_template: >-
      {% set dev = device_id(health) %}
      {{ 'maintenance' not in (labels(health) or []) + ((labels(dev) or []) if dev else []) }}
  # Back-off ladder: past "give up", act once more only to record it; before that, wait at least the cooldown AND
  # at least as long as the App had already been down at the previous restart (one before this outage counts as 0).
  - condition: template
    value_template: >-
      {{ since_last is none
         or (since_last > down_s - give_up_h * 3600 if give_up
             else since_last > cooldown_h * 3600 and since_last >= down_s - since_last) }}

actions:
  - if:
      - condition: template
        value_template: "{{ give_up }}"
    then:
      - action: logbook.log
        data:
          name: Watson self-heal
          entity_id: "{{ health }}"
          message: >-
            {{ (label or state_attr(health, 'friendly_name') or app) | replace(': ', ' ') }}:
            gave up - down {{ (down_s / 3600) | round(0) | int }} h, needs a hand
    else:
      - action: hassio.addon_restart
        continue_on_error: true
        data:
          addon: "{{ app }}"
      - delay:
          seconds: !input check_after
      - action: logbook.log
        data:
          name: Watson self-heal
          entity_id: "{{ health }}"
          message: >-
            {{ (label or state_attr(health, 'friendly_name') or app) | replace(': ', ' ') }}:
            {{ 'still down' if states(health) in bad else 'fixed' }} - restarted the App
