blueprint:
  name: "Watson self-heal: restart an App when it is down"
  description: >-
    When an App (add-on) stops doing its job - its health sensor reads a bad state for a while - restart it,
    once per cooldown, and record whether that helped. The typical use is Zigbee2MQTT: its bridge connection sensor
    goes off when the App or the coordinator stalls. Watson (the Housekeeper App) reads the record.


    Safe by design: restarting an App never switches a device; the cooldown stops restart loops. If the restart
    does not help (for example the coordinator itself is unplugged), the record says "still down" and the morning
    summary asks you.
  domain: automation
  source_url: https://github.com/MoriartySmartHouse/housekeeper-agent/blob/main/blueprints/automation/housekeeper/restart_app_when_down.yaml
  input:
    app:
      name: App
      selector:
        addon: {}
    health:
      name: Health sensor
      description: An entity that shows the App is working, e.g. the Zigbee2MQTT bridge "connection state".
      selector:
        entity: {}
    bad_states:
      name: Counts as down when it reads
      default: ["off", "unavailable", "disconnected", "offline"]
      selector:
        select:
          multiple: true
          custom_value: true
          options: ["off", "unavailable", "unknown", "disconnected", "offline"]
    label:
      name: Name to use in the record
      default: ""
      selector:
        text: {}
    minutes:
      name: Down for
      default: 5
      selector:
        number: {min: 2, max: 120, unit_of_measurement: min}
    cooldown_hours:
      name: At most one restart every
      default: 1
      selector:
        number: {min: 1, max: 48, unit_of_measurement: h}
    check_after:
      name: Check the result after
      default: 180
      selector:
        number: {min: 30, max: 900, unit_of_measurement: s}

mode: single
max_exceeded: silent

variables:
  app: !input app
  health: !input health
  bad: !input bad_states
  label: !input label
  minutes: !input minutes
  cooldown_h: !input cooldown_hours

triggers:
  - trigger: state
    entity_id: !input health
    for:
      minutes: !input minutes
  - trigger: time_pattern
    minutes: "23"

conditions:
  - condition: template
    value_template: >-
      {{ states(health) in bad and (now() - states[health].last_changed).total_seconds() >= minutes * 60 }}
  # Maintenance (HA label, on the entity or its device): someone is working on it - leave it alone.
  - condition: template
    value_template: >-
      {% set dev = device_id(health) %}
      {{ 'maintenance' not in (labels(health) or []) + ((labels(dev) or []) if dev else []) }}
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > cooldown_h * 3600 }}

actions:
  - action: hassio.addon_restart
    continue_on_error: true
    data:
      addon: "{{ app }}"
  - delay:
      seconds: !input check_after
  - action: logbook.log
    data:
      name: Watson self-heal
      entity_id: "{{ health }}"
      message: >-
        {{ (label or state_attr(health, 'friendly_name') or app) | replace(': ', ' ') }}:
        {{ 'still down' if states(health) in bad else 'fixed' }} - restarted the App
