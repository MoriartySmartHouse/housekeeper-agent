name: Housekeeper Agent
version: "0.1.7"
slug: housekeeper_agent
description: Hourly read-only health check of this home; reports to the Housekeeper service.
url: https://github.com/MoriartySmartHouse/housekeeper-agent
# Prebuilt multi-arch image published by .github/workflows/release.yaml; `version` is its tag.
# The image for a version must exist before main announces that version (push the tag first).
image: ghcr.io/moriartysmarthouse/housekeeper-agent
arch:
  - aarch64
  - amd64
init: false
# Reads Core (REST + websocket) through the Supervisor proxy. NOTE: this proxy acts with
# admin rights on Core; the agent's code is read-only except for sensor.housekeeper_status.
homeassistant_api: true
# Supervisor API at the lowest role ("default", left implicit): /resolution/info and other /info only.
# Never add hassio_role: manager/admin.
hassio_api: true
options:
  persona: Watson
  site_id: ""
  site_key: ""
  central_url: ""
  interval_minutes: 60
  silent_hours: 24
  battery_warn_pct: 25
  silent_exceptions: []
  automation_exceptions: []
  zero_power_hours: 6
  zero_power_exceptions: []
  integration_exceptions: []
  log_error_threshold: 10
  watch_entities: []
  watch: []
schema:
  persona: match(^.{1,24}$)
  site_id: match(^[a-z0-9-]{2,32}$)
  site_key: password
  central_url: url
  interval_minutes: int(5,90)
  healthchecks_url: url?
  silent_hours: int(1,720)
  battery_warn_pct: int(5,60)
  silent_exceptions:
    - str
  automation_exceptions:
    - str
  zero_power_hours: int(1,168)
  zero_power_exceptions:
    - str
  integration_exceptions:
    - str
  log_error_threshold: int(1,10000)
  watch_entities:
    - entity: str
      bad_states: str
      for_minutes: int(1,10080)
  watch:
    - str
